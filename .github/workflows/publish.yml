name: Publish

# Every mod whose Cargo.toml version has no release yet is built for each server platform, packed
# into one .mmc and released as <id>-v<version>; then index.toml is regenerated so the moddedMC
# app lists it. Bumping a mod's version is how a new build ships.
on:
  push:
    branches: [main]
    paths: ["mods/**", "Cargo.toml", "Cargo.lock", "scripts/publish.py", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mods: ${{ steps.plan.outputs.mods }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "mods=$(python3 scripts/publish.py plan)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.mods != '[]'
    strategy:
      matrix:
        include:
          - { os: windows-2025, platform: windows-x86_64 }
          - { os: ubuntu-24.04, platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Build
        shell: bash
        env:
          # Windows: link the C runtime in, so the mod loads on a PC without the VC++ redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          args=$(echo '${{ needs.plan.outputs.mods }}' | python3 -c "import json,sys; print(' '.join('-p ' + m for m in json.load(sys.stdin)))")
          cargo build --release $args
          mkdir -p libs/${{ matrix.platform }}
          find target/release -maxdepth 1 \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) -exec cp {} libs/${{ matrix.platform }}/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libs-${{ matrix.platform }}
          path: libs

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: libs-*
          merge-multiple: true
          path: libs
      - name: Pack and release
        run: |
          python3 scripts/publish.py pack libs out
          for mod in $(echo '${{ needs.plan.outputs.mods }}' | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)))"); do
            version=$(python3 -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1],'rb'))['package']['version'])" "mods/$mod/Cargo.toml")
            file="out/$mod-$version.mmc"
            gh release create "$mod-v$version" "$file" --title "$mod $version" --notes "Install it from the Mods tab in moddedMC, or drop $(basename "$file") into a server's mods folder."
          done
      - name: Update the index
        run: |
          python3 scripts/publish.py index out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.toml
          git diff --cached --quiet || { git commit -m "chore(index): publish $(echo '${{ needs.plan.outputs.mods }}' | tr -d '[]\"')" && git push; }
